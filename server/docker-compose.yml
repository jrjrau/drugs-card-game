services:
  drugs:
    # Pulls the image built automatically by GitHub Actions on every push.
    # To build locally instead, comment out `image:` and uncomment `build:`.
    image: ghcr.io/jrjrau/drugs-card-game:latest
    # build: .
    container_name: drugs-card-game
    ports:
      - "3168:3000"
    environment:
      - ADMIN_KEY=change-me-please
      # Discord Activity (optional). The secret comes from the Developer
      # Portal -> OAuth2 -> Reset Secret. NEVER commit the real value.
      - DISCORD_CLIENT_ID=1533728522395320391
      - DISCORD_CLIENT_SECRET=put-your-regenerated-secret-here
      # Shown on /privacy and /terms (Discord verification requires a contact).
      # Kept here rather than in the repo so the address isn't public on GitHub.
      - SUPPORT_URL=https://discord.gg/your-invite
      - CONTACT_EMAIL=you@example.com
      # - DRAIN_TIMEOUT_MIN=15
      # Show city/country next to each IP in /admin (one cached lookup per IP
      # via ip-api.com). Off by default — no outbound calls unless enabled.
      # - GEOIP=1
      # IPs blocked from the start; the dashboard's block list adds to this.
      # - BLOCK_IPS=203.0.113.9,203.0.113.10
      # Set to 0 only if the server is exposed without a reverse proxy in
      # front — otherwise X-Forwarded-For is how the real client IP arrives.
      # - TRUST_PROXY=1
    # let running games finish before the container is replaced (graceful drain)
    stop_grace_period: 16m
    volumes:
      # Named volume: Docker gives it the image's ownership (uid 1000 / "node"),
      # so stats.json is writable with no chown needed on the host.
      - drugs-data:/app/data
      # Prefer a host folder you can browse? Use this instead, but the folder
      # must be owned by uid 1000:
      #   mkdir -p data && sudo chown -R 1000:1000 data
      # - ./data:/app/data
    restart: unless-stopped

volumes:
  drugs-data:

services:
  drugs:
    # Pulls the image built automatically by GitHub Actions on every push.
    # To build locally instead, comment out `image:` and uncomment `build:`.
    image: ghcr.io/jrjrau/drugs-card-game:latest
    # build: .
    container_name: drugs-card-game
    ports:
      - "3168:3000"
    environment:
      - ADMIN_KEY=change-me-please
      # Discord Activity (optional). The secret comes from the Developer
      # Portal -> OAuth2 -> Reset Secret. NEVER commit the real value.
      - DISCORD_CLIENT_ID=1533728522395320391
      - DISCORD_CLIENT_SECRET=put-your-regenerated-secret-here
      # Shown on /privacy and /terms (Discord verification requires a contact).
      # Kept here rather than in the repo so the address isn't public on GitHub.
      - SUPPORT_URL=https://discord.gg/your-invite
      - CONTACT_EMAIL=you@example.com
      # - DRAIN_TIMEOUT_MIN=15
      # How long a game with nobody connected is held open for rejoins
      # (it freezes meanwhile). Default 5 minutes.
      # - ROOM_GRACE_MIN=5
      # Show city/country next to each IP in /admin (one cached lookup per IP
      # via ip-api.com). Off by default — no outbound calls unless enabled.
      # - GEOIP=1
      # IPs blocked from the start; the dashboard's block list adds to this.
      # - BLOCK_IPS=203.0.113.9,203.0.113.10
      # Set to 0 only if the server is exposed without a reverse proxy in
      # front — otherwise X-Forwarded-For is how the real client IP arrives.
      # - TRUST_PROXY=1
      # Discord webhook (Server Settings -> Integrations -> Webhooks -> New).
      # The game posts "update on the way" when it starts draining and
      # "vX.Y.Z is live" once the new container is serving. Leave unset for none.
      - DISCORD_WEBHOOK_URL=
    labels:
      # Only containers with this label are auto-updated by Watchtower below,
      # so nothing else on the NAS is touched.
      - com.centurylinklabs.watchtower.enable=true
    # let running games finish before the container is replaced (graceful drain)
    stop_grace_period: 16m
    volumes:
      # Named volume: Docker gives it the image's ownership (uid 1000 / "node"),
      # so stats.json is writable with no chown needed on the host.
      - drugs-data:/app/data
      # Prefer a host folder you can browse? Use this instead, but the folder
      # must be owned by uid 1000:
      #   mkdir -p data && sudo chown -R 1000:1000 data
      # - ./data:/app/data
    restart: unless-stopped

  # ================= automatic updates =================
  # Polls GHCR for a new :latest, pulls it and recreates the game container —
  # so a push to main goes live on its own a few minutes later.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: drugs-watchtower
    environment:
      # Only touch containers labelled watchtower.enable=true (see above).
      - WATCHTOWER_LABEL_ENABLE=true
      # CRITICAL: Watchtower's own stop timeout, default 10s, overrides the
      # compose stop_grace_period. Without this it would SIGKILL the server
      # 10 seconds into a graceful drain and kill games in progress.
      - WATCHTOWER_TIMEOUT=16m
      - WATCHTOWER_POLL_INTERVAL=300      # check every 5 minutes
      - WATCHTOWER_CLEANUP=true           # delete the superseded image
      - WATCHTOWER_INCLUDE_RESTARTING=true
      # Optional: Watchtower's own "I pulled a new image" notice. Convert a
      # Discord webhook URL .../webhooks/<id>/<token> to discord://<token>@<id>
      # - WATCHTOWER_NOTIFICATION_URL=discord://token@id
      # - WATCHTOWER_NOTIFICATIONS_LEVEL=info
    volumes:
      # Watchtower drives the host's Docker; this socket is how.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  drugs-data:

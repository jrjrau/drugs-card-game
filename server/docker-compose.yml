services:
  drugs:
    # Pulls the image built automatically by GitHub Actions on every push.
    # To build locally instead, comment out `image:` and uncomment `build:`.
    image: ghcr.io/jrjrau/drugs-card-game:latest
    # build: .
    container_name: drugs-card-game
    ports:
      - "3000:3000"
    environment:
      - ADMIN_KEY=change-me-please
    volumes:
      - ./data:/app/data
    restart: unless-stopped

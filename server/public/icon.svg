<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
<!-- App icon: a 10 of spades with the transparent 3 laid over it, the way the
     mirror card looks in game — the 10 is genuinely read through the glass
     rather than drawn twice. No filters or webfonts, so it rasterises the same
     everywhere. -->
<defs>
  <radialGradient id="felt" cx="50%" cy="40%" r="74%">
    <stop offset="0%"  stop-color="#2a7a4f"/>
    <stop offset="58%" stop-color="#195232"/>
    <stop offset="100%" stop-color="#0a2718"/>
  </radialGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#e6e4dc"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#eaf8ff" stop-opacity=".34"/>
    <stop offset="50%"  stop-color="#cdeeff" stop-opacity=".20"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity=".30"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"  stop-color="#ffffff" stop-opacity=".50"/>
    <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="1024" height="1024" rx="180" fill="url(#felt)"/>
<circle cx="512" cy="480" r="386" fill="none" stroke="#ffd54a" stroke-opacity=".14" stroke-width="10"/>

<!-- ================= 10 of spades ================= -->
<g transform="translate(410 496) rotate(-14)">
  <rect x="-178" y="-256" width="356" height="512" rx="32" fill="#00160c" fill-opacity=".40"
        transform="translate(16 22)"/>
  <rect x="-178" y="-256" width="356" height="512" rx="32" fill="url(#paper)"/>
  <rect x="-178" y="-256" width="356" height="512" rx="32" fill="none"
        stroke="#15152b" stroke-opacity=".16" stroke-width="5"/>
  <text x="-16" y="30" text-anchor="middle" fill="#15152b"
        font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="234"
        font-weight="700" letter-spacing="-12">10</text>
  <text x="-16" y="164" text-anchor="middle" fill="#15152b"
        font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="120">&#9824;</text>
  <text x="-142" y="-168" fill="#15152b"
        font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="76"
        font-weight="700" letter-spacing="-5">10</text>
  <text x="-136" y="-102" fill="#15152b"
        font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="58">&#9824;</text>
</g>

<!-- ================= the transparent 3 over it ================= -->
<g transform="translate(648 552) rotate(12)">
  <rect x="-166" y="-244" width="332" height="488" rx="30" fill="#00160c" fill-opacity=".26"
        transform="translate(14 20)"/>
  <rect x="-166" y="-244" width="332" height="488" rx="30" fill="url(#glass)"/>
  <rect x="-166" y="-244" width="332" height="488" rx="30" fill="none"
        stroke="#ffffff" stroke-opacity=".85" stroke-width="8"/>
  <rect x="-148" y="-226" width="296" height="452" rx="20" fill="none"
        stroke="#ffffff" stroke-opacity=".28" stroke-width="3"/>
  <path d="M-166 -70 L-166 -214 Q-166 -244 -136 -244 L66 -244 Z" fill="url(#sheen)"/>
  <!-- outlined so it reads over both the white card and the felt -->
  <text x="0" y="92" text-anchor="middle" fill="#ffffff"
        stroke="#0d3a24" stroke-opacity=".55" stroke-width="9" paint-order="stroke"
        font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="296"
        font-weight="700">3</text>
  <text x="-124" y="-158" fill="#ffffff"
        stroke="#0d3a24" stroke-opacity=".45" stroke-width="5" paint-order="stroke"
        font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="82"
        font-weight="700">3</text>
</g>
</svg>
